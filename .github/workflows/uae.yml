name: UAE BOX OFFICE

on:
  schedule:
    - cron: '*/40 * * * *'
  workflow_dispatch:

concurrency:
  group: uae-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        mode: [daily, advance]

    env:
      REPO: thetextmail007/uae
      PYTHONDONTWRITEBYTECODE: "1"
      DISPLAY: :99

    steps:
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -d "uae/gcc/uae" ]; then cd uae/gcc/uae; elif [ -d "uae" ]; then cd uae; elif [ -d "gcc/uae" ]; then cd gcc/uae; fi
          python -m pip install --upgrade pip
          pip install playwright tabulate requests
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run scraper
        run: |
          if [ -d "uae/gcc/uae" ]; then cd uae/gcc/uae; elif [ -d "uae" ]; then cd uae; elif [ -d "gcc/uae" ]; then cd gcc/uae; fi
          MODE="${{ matrix.mode }}"
          DATE=$(date -u +'%Y-%m-%d')

          echo "🎬 Running uae.py with mode $MODE"

          for i in {1..6}; do
            echo "Attempt $i"
            if xvfb-run -a python uae.py --mode "$MODE" --date "$DATE"; then
              echo "✅ Scraper finished successfully"
              break
            fi
            echo "❌ Scraper failed. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Commit scraper data
        run: |
          if [ -d "uae/gcc/uae" ]; then cd uae/gcc/uae; elif [ -d "uae" ]; then cd uae; elif [ -d "gcc/uae" ]; then cd gcc/uae; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/ || true
          git commit -m "${{ matrix.mode }} update ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"
          
          for i in {1..5}; do
            echo "Push attempt $i"
            git pull --rebase --autostash origin main || true
            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi
            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
