name: Test ProxyBridge & Cinepolis API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install and Test ProxyBridge CLI with default proxy
      - name: Install and Test ProxyBridge with Default Proxy
        run: |
          echo "=== 4. Downloading ProxyBridge Linux v3.2.0 ==="
          curl -sL -o ProxyBridge-Linux.tar.gz "https://github.com/InterceptSuite/ProxyBridge/releases/download/v3.2.0/ProxyBridge-Linux-v3.2.0.tar.gz"
          mkdir -p pb_install && tar -xzf ProxyBridge-Linux.tar.gz -C pb_install
          cd pb_install

          echo "Installing dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y libnetfilter-queue1 libnetfilter-queue-dev iptables || true

          if [ -f setup.sh ]; then
            sudo bash setup.sh || true
          fi

          echo "Checking ProxyBridge binary..."
          which ProxyBridge || true
          if command -v ProxyBridge &>/dev/null; then
            echo "ProxyBridge version / help:"
            sudo ProxyBridge --help || true

            echo "Starting ProxyBridge with DEFAULT proxy (no --proxy flag)..."
            # Running with no --proxy flag uses ProxyBridge's built-in default (socks5://127.0.0.1:4444)
            sudo ProxyBridge --rule "curl;python;python3:*:*:TCP:PROXY" &
            PB_PID=$!
            sleep 3

            echo "Testing curl through ProxyBridge DEFAULT proxy:"
            curl -v -m 10 "https://api.cinepolisgulf.com/api/v2/home/advancebooking-v2/?country_id=2" || true

            echo "Cleaning up ProxyBridge..."
            sudo kill -9 $PB_PID || true
            sudo ProxyBridge --cleanup || true
          else
            echo "ProxyBridge binary was not found or failed to install."
          fi
