name: IRELAND TARGET DATE

on:
  schedule:
    - cron: '0/40 * * * *'   # runs every 4 hours
  workflow_dispatch:
  

permissions:
  contents: write

concurrency:
  group: ireland-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      REPO: thetextmail007/ireland
      TARGET_DATE: ${{ github.event.inputs.target_date || '20260923' }}
      DAYS: ${{ github.event.inputs.days || '2' }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Ensure Directory Context
        run: |
          if [ ! -f "ireland.py" ] && [ ! -d "ireland" ] && [ -n "${{ secrets.GH_PAT }}" ]; then
            git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git ireland || true
          fi

      - name: Install System Dependencies (xvfb & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libpangocairo-1.0-0 libxss1 libgtk-3-0 libasound2* || sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libasound2 libpangocairo-1.0-0 libxss1 libgtk-3-0
          if ! command -v google-chrome &> /dev/null; then
            echo "Installing Google Chrome..."
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable || true
          fi
          google-chrome --version || which google-chrome || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies for Cloudflare bypass
        run: |
          DIR="ireland/mcp-chrome-cloudflare-bypass"
          if [ ! -d "$DIR" ] && [ -d "mcp-chrome-cloudflare-bypass" ]; then
            DIR="mcp-chrome-cloudflare-bypass"
          fi
          if [ ! -d "$DIR" ] && [ -d "germany/mcp-chrome-cloudflare-bypass" ]; then
            DIR="germany/mcp-chrome-cloudflare-bypass"
          fi
          if [ -d "$DIR" ]; then
            echo "Installing dependencies in $DIR..."
            cd "$DIR"
            npm install --production
          else
            echo "Warning: Bypass directory not found."
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d "ireland" ]; then cd ireland; fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests aiohttp cloudscraper playwright tabulate tzdata

      - name: Run Ireland Target Date Scrapers
        run: |
          if [ -d "ireland" ]; then cd ireland; fi

          sudo mkdir -p /tmp/.X11-unix
          sudo chmod 1777 /tmp/.X11-unix

          python - << 'EOF'
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          IE_TZ = ZoneInfo("Europe/Dublin")
          today = datetime.now(IE_TZ).date()

          custom_date = os.environ.get("TARGET_DATE", "").strip()
          custom_days = os.environ.get("DAYS", "7").strip()

          try:
              num_days = int(custom_days)
          except ValueError:
              num_days = 7

          if custom_date:
              clean = custom_date.replace("-", "").replace("/", "")
              start = datetime.strptime(clean, "%Y%m%d").date()
          else:
              start = today + timedelta(days=1)

          dates = [(start + timedelta(days=i)).strftime("%Y%m%d") for i in range(num_days)]
          print(f"🎯 Target dates ({len(dates)}): {', '.join(dates)}")

          for d in dates:
              print(f"\n============================================================")
              print(f"🎬 Processing Ireland Target Date: {d}")
              print(f"============================================================")
              cmd = ["xvfb-run", "-a", "-s", "-screen 0 1920x1080x24 -ac", sys.executable, "ireland.py", "--date", d]
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"⚠️ Non-zero exit code for {d}: {res.returncode}")
          EOF

      - name: Commit and Push Data
        run: |
          if [ -d "ireland" ]; then cd ireland; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/ || true
          git commit -m "Ireland target date update (${TARGET_DATE}) ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs --autostash origin main || git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            AUTH_TOKEN="${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}"
            if git push "https://x-access-token:${AUTH_TOKEN}@github.com/${{ env.REPO }}.git" HEAD:main || git push origin HEAD || git push; then
              echo "✅ Push succeeded"
              break
            fi
            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
