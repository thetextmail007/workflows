name: UK TARGET DATE

on:
  schedule:
    - cron: '0 */4 * * *'   # runs every 4 hours
  workflow_dispatch:

# Prevent overlapping runs
concurrency:
  group: uk-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      REPO: thetextmail007/uk
      TARGET_DATE: "20260923"    # ← Hardcoded target date (YYYYMMDD)
      DAYS: "2"                  # Target window (next 7 days)
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 🔒 Clone PRIVATE repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      # 💻 Install System Dependencies (xvfb & Google Chrome)
      - name: Install System Dependencies (xvfb & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libpangocairo-1.0-0 libxss1 libgtk-3-0 libasound2* || sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libasound2 libpangocairo-1.0-0 libxss1 libgtk-3-0
          if ! command -v google-chrome &> /dev/null; then
            echo "Installing Google Chrome..."
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable || true
          fi
          google-chrome --version || which google-chrome || true

      # 🐍 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🟢 Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 📦 Install Node dependencies for Cloudflare bypass
      - name: Install Node dependencies for Cloudflare bypass
        run: |
          if [ -d "uk" ]; then cd uk; fi
          DIR="mcp-chrome-cloudflare-bypass"
          if [ -d "$DIR" ]; then
            echo "Installing dependencies in $DIR..."
            cd "$DIR"
            npm install --production
          else
            echo "Warning: Bypass directory not found."
          fi

      # 📦 Install Python dependencies
      - name: Install Python dependencies
        run: |
          if [ -d "uk" ]; then cd uk; fi
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests aiohttp cloudscraper playwright tabulate tzdata

      # 🎬 Run Scrapers
      - name: Run UK Target Date Scrapers (Next 7 Days)
        run: |
          if [ -d "uk" ]; then cd uk; fi

          sudo mkdir -p /tmp/.X11-unix
          sudo chmod 1777 /tmp/.X11-unix

          # Compute target dates using python
          python - << 'EOF'
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          UK_TZ = ZoneInfo("Europe/London")
          today = datetime.now(UK_TZ).date()

          custom_date = os.environ.get("TARGET_DATE", "").strip()
          custom_days = os.environ.get("DAYS", "7").strip()

          try:
              num_days = int(custom_days)
          except ValueError:
              num_days = 7

          if custom_date:
              clean = custom_date.replace("-", "").replace("/", "")
              start = datetime.strptime(clean, "%Y%m%d").date()
          else:
              start = today + timedelta(days=1)

          dates = [(start + timedelta(days=i)).strftime("%Y%m%d") for i in range(num_days)]
          print(f"🎯 Target dates ({len(dates)}): {', '.join(dates)}")

          for d in dates:
              print(f"\n============================================================")
              print(f"🎬 Processing UK Target Date: {d}")
              print(f"============================================================")
              cmd = ["xvfb-run", "-a", "-s", "-screen 0 1920x1080x24 -ac", sys.executable, "uk.py", "--date", d]
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"⚠️ Non-zero exit code for {d}: {res.returncode}")
          EOF

      # 💾 Commit & Push
      - name: Commit scraper data
        run: |
          if [ -d "uk" ]; then cd uk; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove __pycache__ folders and untrack them if previously tracked in repo
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/ || true

          git commit -m "target=${TARGET_DATE} advance ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi
            echo "❌ Push failed. Retrying in 5s..."
            sleep 5
          done
